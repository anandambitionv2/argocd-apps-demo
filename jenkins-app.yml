
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.jenkins.io
    chart: jenkins
    targetRevision: "9.3.4"
    helm:
      releaseName: jenkins-release

  destination:
    server: https://aks-external-cluster-hlaekz7t.hcp.centralindia.azmk8s.io
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
