#app2-externalcluster.yml 
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-childapp-app2-externalcluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anandambitionv2/customer-1-repo.git
    targetRevision: main
    path: .
  destination:
    server: https://aksclusterargocd-oyrl8930.hcp.centralindia.azmk8s.io
    namespace: customer-1-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true