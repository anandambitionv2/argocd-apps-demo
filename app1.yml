#app1.yml 
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-childapp-customer-1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anandambitionv2/customer-1-repo.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-1-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true