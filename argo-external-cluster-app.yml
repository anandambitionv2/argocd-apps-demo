
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-external-helm
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: "9.3.4"
    helm:
      releaseName: myargocd-release

  destination:
    server: https://aks-external-cluster-hlaekz7t.hcp.centralindia.azmk8s.io
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
